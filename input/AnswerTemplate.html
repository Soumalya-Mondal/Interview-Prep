<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Q&amp;A</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.3; padding: 10px; }
        h1.page-title { text-align: center; color: #ffffff; font-size: 2rem; margin-bottom: 30px; border-bottom: 2px solid #ffffff; padding-bottom: 15px; }
        .accordion { width: 100%; margin: 0 auto; padding: 0 15px; }
        .qa-item { margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #333333; }
        .qa-question { background-color: #111111; padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 1rem; font-weight: 600; color: #ffffff; transition: background-color 0.2s; user-select: none; }
        .qa-question:hover { background-color: #1a1a1a; }
        .qa-question.active { background-color: #222222; color: #ffffff; }
        .qa-question .icon { font-size: 1.2rem; transition: transform 0.3s; flex-shrink: 0; margin-left: 12px; }
        .qa-question.active .icon { transform: rotate(45deg); }
        .qa-answer { display: none; background-color: #0a0a0a; padding: 20px 24px; border-top: 1px solid #333333; }
        .qa-answer.open { display: block; }
        .qa-answer h1, .qa-answer h2, .qa-answer h3, .qa-answer h4 { color: #ffffff; margin: 16px 0 8px; }
        .qa-answer p { margin: 8px 0; color: #ffffff; }
        .qa-answer ul, .qa-answer ol { margin: 8px 0 8px 24px; }
        .qa-answer li { margin: 4px 0; color: #ffffff; }
        .qa-answer pre { margin: 12px 0; border-radius: 6px; overflow-x: auto; background-color: #2d2d2d !important; }
        .qa-answer pre code { background-color: #2d2d2d !important; color: #f0f0f0 !important; }
        .qa-answer code:not([class*="language-"]) { background-color: #2d2d2d; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: #f0f0f0; }
        .qa-answer blockquote { border-left: 4px solid #ffffff; padding-left: 12px; color: #cccccc; margin: 10px 0; }
        .qa-answer a { color: #cccccc; }
        .q-number { color: #aaaaaa; font-size: 0.85rem; margin-right: 10px; flex-shrink: 0; }
    </style>
</head>
<body>
    <h1 class="page-title">Interview Q&amp;A</h1>
    <div class="accordion">
        {% for item in qa_items %}
        <div class="qa-item">
            <div class="qa-question" onclick="toggleAnswer(this)">
                <span><span class="q-number">Q{{ item.index }}.</span>{{ item.question }}</span>
                <span class="icon">+</span>
            </div>
            <div class="qa-answer">
                {{ item.answer_html | safe }}
            </div>
        </div>
        {% endfor %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script>
        function toggleAnswer(questionEl) {
            const answerEl = questionEl.nextElementSibling;
            const isOpen = answerEl.classList.contains('open');
            document.querySelectorAll('.qa-answer.open').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.qa-question.active').forEach(el => el.classList.remove('active'));
            if (!isOpen) {
                answerEl.classList.add('open');
                questionEl.classList.add('active');
                Prism.highlightAllUnder(answerEl);
            }
        }
    </script>
</body>
</html>
